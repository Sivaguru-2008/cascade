name: CI Test & Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Test Suite & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Generate Synthetic Verification Dataset
        run: |
          python -m datagen.generate --patients 500 --seed 7

      - name: Train Real-Time Scorer (Loop 1)
        run: |
          python -m loop1.train

      - name: Execute Full Test Suite
        run: |
          pytest -v
