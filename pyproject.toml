[project]
name = "cascade"
version = "0.1.0"
description = "CASCADE: real-time prescribing-cascade detection (IBM Z Datathon 2026, Team sudo make us win)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ANN"]
ignore = ["ANN401", "B008"]  # B008: FastAPI Depends()/Query() defaults are the framework idiom

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
"eval/make_report.py" = ["E501"]  # Markdown table rows

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
