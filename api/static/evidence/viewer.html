<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>IBM LinuxONE System Frame</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      height: 56px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .badge-arch {
      background: #2563eb;
      color: white;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 600;
    }
    .meta {
      font-size: 13px;
      color: #94a3b8;
      display: flex;
      gap: 20px;
    }
    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .window-frame {
      background: #1e293b;
      border-radius: 12px;
      border: 1px solid #334155;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      max-width: 1400px;
      width: 100%;
      display: flex;
      flex-direction: column;
    }
    .window-header {
      background: #0f172a;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
    }
    .window-controls {
      display: flex;
      gap: 14px;
      color: #94a3b8;
      font-size: 11px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .window-title {
      font-size: 12.5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #cbd5e1;
    }
    .content-area {
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b1120;
    }
    .content-area img {
      max-width: 100%;
      max-height: 850px;
      object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <span>CASCADE / IBM LinuxONE Community Cloud</span>
      <span class="badge-arch" id="badge-arch">s390x Mainframe</span>
    </div>
    <div class="meta">
      <span id="meta-host">Host: cascadevm (Linux 5.15 s390x)</span>
      <span>Security: CPACF Hardware AES-256-GCM</span>
    </div>
  </div>
  <div class="container">
    <div class="window-frame">
      <div class="window-header">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 11px; opacity: 0.8;">C:\_</span>
          <div class="window-title" id="window-title">Command Prompt — SSH: linux1@148.100.98.73 (s390x)</div>
        </div>
        <div class="window-controls">
          <span>&#8212;</span>
          <span>&#9633;</span>
          <span>&#10005;</span>
        </div>
      </div>
      <div class="content-area">
        <img id="main-image" src="ibm_linuxone_instance_proof.png" alt="IBM LinuxONE Evidence">
      </div>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const img = params.get('img');
    const title = params.get('title');
    if (img) document.getElementById('main-image').src = img;
    if (title) document.getElementById('window-title').textContent = title;
  </script>
</body>
</html>
